name: NiceShell.Cli Nuget
on:
  push:
    paths:
      - 'clis/lib/**'
      - '.github/workflows/cli-nuget.yaml'
  workflow_dispatch:

jobs:
  publish:
    name: Pack & Publish nuget
    runs-on: ubuntu-latest
    steps:
      - uses: astorDev/versy/calver/nuget@main
        with:
          project: clis/lib/NiceShell.Cli
          nuget-api-key: ${{ secrets.NUGET_API_KEY }}